name: Collect CSE data

on:
  schedule:
    # Times are UTC. Colombo is UTC+05:30; the market closes at 14:30 Colombo.
    - cron: "37 9 * * 1-5"   # 15:07 Colombo, Mon-Fri: main run
    - cron: "52 10 * * 1-5"  # 16:22 Colombo, Mon-Fri: backup run, does nothing if the main run worked
  workflow_dispatch:
    inputs:
      force:
        description: "Overwrite today's data if it is already stored"
        type: boolean
        default: false
      companies:
        description: "Per-company snapshot: auto (weekly), always, never"
        type: choice
        options: [auto, always, never]
        default: auto

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Collect today's snapshot
        run: |
          args="--companies ${{ inputs.companies || 'auto' }}"
          if [ "${{ inputs.force }}" = "true" ]; then args="$args --force"; fi
          python -m collector.collect $args

      - name: Save new data to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new data (weekend, holiday or already collected)."
            exit 0
          fi
          day=$(python -c "import json; print(json.load(open('data/status.json'))['last_trade_date'])")
          git commit -m "data: CSE snapshot for $day"
          for attempt in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep 10
          done
          echo "Could not push after 3 attempts" >&2
          exit 1
